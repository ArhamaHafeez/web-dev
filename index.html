<!DOCTYPE html>
<html>
<head>
    <title>My Products</title>

   
</head>

<body>

    <h1 text-align:centre> My Products</h1>

    <div class="products">

        <div class="product">
            <h2>T-Shirt</h2>
            
            <img src="https://mir-s3-cdn-cf.behance.net/project_modules/disp/7911b828048421.57201f79a3061.jpg" alt="T-Shirt Design" height="150px" width="150px"><br>
            <p class="price">Rs. 1200</p>
            <button onclick="minus(0)">-</button>
            <span class="count" id="count0">0</span>
            <button onclick="plus(0)">+</button>
        </div>

        <div class="product">
            <h2>Jeans</h2>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4GuIC6GdKMO8ylgRKAlrtoP7nG08voWUK6GZqvlwrF2VGEizlU-ewY6vy&s=10" alt="Jeans" height="150px" width="150px"><br>
            <p class="price">Rs. 2500</p>
            <button onclick="minus(1)">-</button>
            <span class="count" id="count1">0</span>
            <button onclick="plus(1)">+</button>
        </div>

        <div class="product">
            <h2>Shoes</h2>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQSideqlZyrZjMoRW7gAtz58y_OrRFDSaPHdJrj46Gr3WJhcKBPoW84ATY&s=10" alt="Shoes" height="150px" width="150px"><br>
            <p class="price">Rs. 3500</p>
            <button onclick="minus(2)">-</button>
            <span class="count" id="count2">0</span>
            <button onclick="plus(2)">+</button>
        </div>

        <div class="product">
            <h2>Watch</h2>
            <img src="https://tse4.mm.bing.net/th/id/OIP.j4kW7XFB--Ik05Kg0yTr7gHaE8?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Shoes" height="150px" width="150px"><br>
            <p class="price">Rs. 4000</p>
            <button onclick="minus(2)">-</button>
            <span class="count" id="count2">0</span>
            <button onclick="plus(2)">+</button>
        </div>

       <div class="product">
            <h2>Jewellery</h2>
            <img src="https://tse3.mm.bing.net/th/id/OIP.2VXUI7v_6xdBW3mi6ENyqQHaNK?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Shoes" height="150px" width="150px"><br>
            <p class="price">Rs. 50000</p>
            <button onclick="minus(2)">-</button>
            <span class="count" id="count2">0</span>
            <button onclick="plus(2)">+</button>
        </div>

        <div class="product">
            <h2>Bag</h2>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTt7JAoesCqXkhCTqwzXbM1hc3Ty5mZlzWnlNF2Klm2Sg&s=10"  height="150px" width="150px"><br>
            <p class="price">Rs. 2200</p>
            <button onclick="minus(5)">-</button>
            <span class="count" id="count5">0</span>
            <button onclick="plus(5)">+</button>
        </div>

    </div>
<style>
    .products {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
        max-width: 1000px;
        margin: 0 auto;
    }

    .product {
        text-align: center;
        border: 1px solid #ddd;
        padding: 20px;
        border-radius: 10px;
        background-color: #f9f9f9;
    }

    .product img {
        width: 150px;
        height: 150px;
        object-fit: cover;
    }

    .product button {
        padding: 5px 12px;
        font-size: 18px;
        cursor: pointer;
    }

    .count {
        margin: 0 10px;
        font-size: 18px;
    }

    .price {
        font-weight: bold;
        color: green;
    }
</style>

    <script>

        let counts = [0, 0, 0, 0, 0, 0];

        function plus(product) {
            counts[product]++;

            document.getElementById("count" + product).innerText =
                counts[product];
        }

        function minus(product) {
            if (counts[product] > 0) {
                counts[product]--;
            }

            document.getElementById("count" + product).innerText =
                counts[product];
        }

    </script>

</body>
</html>
