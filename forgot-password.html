<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | JobNest</title>


    <link
        rel="stylesheet"
        href="assets/style.css"
    >


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

</head>


<body>


<div class="auth-page">


    <!-- LEFT -->

    <div class="auth-left">


        <div class="auth-logo">

            <img
                src="Jobnest-logo.png"
                alt="JobNest"
            >

        </div>


        <div class="auth-content">


            <span>
                ACCOUNT RECOVERY
            </span>


            <h1>
                Don't Worry,
                We've Got You.
            </h1>


            <p>
                Reset your password and get back
                to discovering your next great
                opportunity.
            </p>


        </div>


    </div>



    <!-- RIGHT -->

    <div class="auth-right">


        <div class="auth-box">


            <div class="mobile-logo">

                <img
                    src="assets/jobnest-logo.png"
                    alt="JobNest"
                >

            </div>



            <h2>
                Forgot Password?
            </h2>


            <p class="auth-subtitle">

                Enter your email address and we'll
                help you reset your password.

            </p>



            <div id="forgotAlert"></div>



            <form id="forgotForm">


                <div class="form-group">


                    <label>
                        Email Address
                    </label>


                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="forgotEmail"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                </div>



                <button
                    type="submit"
                    class="auth-btn"
                >

                    Continue

                    <i class="fa-solid fa-arrow-right"></i>

                </button>


            </form>



            <div class="auth-footer">

                <a href="login.html">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back to Sign In

                </a>

            </div>


        </div>


    </div>


</div>



<script src="js/auth.js"></script>


</body>

</html>
